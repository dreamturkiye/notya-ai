<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radyoloji — Pre-sprint Audit · Notya</title>
  <meta name="description" content="Pre-sprint RADYOLOJI baseline ~10%. No PHI." />
  <style>
    :root { --bg:#060C18; --surface:#0D1526; --stroke:rgba(255,255,255,0.10); --text:#EDF1F7; --muted:#8FA0B5; --dim:#64748B; --teal:#2DD4BF; --amber:#F59E0B; --red:#F87171; --green:#34D399; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    .wrap { max-width:900px; margin:0 auto; padding:32px 20px 72px; }
    h1 { font-size:26px; } .lede { color:var(--muted); }
    .pill { display:inline-flex; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid transparent; }
    .pill.warning { background:rgba(245,158,11,.14); color:var(--amber); } .pill.danger { background:rgba(248,113,113,.14); color:var(--red); }
    .bar-track { height:10px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; margin:12px 0; }
    .bar-fill { height:100%; background:var(--teal); width:10%; }
    .foot { margin-top:36px; font-size:12px; color:var(--dim); border-top:1px solid var(--stroke); padding-top:16px; }
  </style>
</head>
<body>
<div class="wrap">
  <p style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700">Notya · Pre-sprint specialty audit · Radyoloji</p>
  <h1>Radyoloji — Pre-sprint (~10%)</h1>
  <p class="lede">Baseline registry only. Exceptional sprint supersedes: <a href="/radyo-exceptional-audit.html" style="color:var(--teal)">radyo-exceptional-audit.html</a></p>
  <span class="pill warning">Honest wow ~10%</span>
  <span class="pill danger">Thin / Missing most domains</span>
  <div class="bar-track"><div class="bar-fill"></div></div>
  <p class="foot">Never linked from /doktor-tools · No PHI</p>
</div>
</body>
</html>
