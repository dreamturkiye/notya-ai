    <mask id="sol"><rect width="720" height="480" fill="url(#solSoluk)"/></mask>
    <linearGradient id="tepe1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d6c2"/><stop offset="1" stop-color="#dde6d6"/></linearGradient>
